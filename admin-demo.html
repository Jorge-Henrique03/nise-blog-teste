<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teste do painel — Nise</title><style>body{font:16px Arial,sans-serif;background:#f4f2ec;color:#23251f;margin:0}header{background:#151915;color:#f3d49b;padding:24px 5%;font-size:24px}main{max-width:880px;margin:35px auto;padding:0 20px}section{background:white;padding:25px;border:1px solid #ddd8ca}label{display:block;margin:18px 0 6px;font-weight:bold}input,select,textarea{box-sizing:border-box;width:100%;padding:13px;border:1px solid #bdb9af;font:inherit}button{background:#c8a05a;color:#151515;border:0;padding:14px 20px;margin:18px 8px 0 0;font-weight:bold;cursor:pointer}.muted{color:#6b6b62;font-size:14px}.notice{background:#fff2ce;padding:15px;line-height:1.6}#preview{display:none;border-top:1px solid #ddd;margin-top:25px;padding-top:20px}#preview h2{font-size:28px}a{color:#88651f}</style></head><body><header>NISE · Painel de conteúdos — TESTE</header><main><div class="notice"><strong>Demonstração local:</strong> você pode preencher e visualizar um artigo. O botão não publica na internet. O painel definitivo requer configuração de CMS, autenticação e repositório.</div><section><form id="editor"><label for="title">Título do artigo</label><input id="title" required value="Reforma Tributária: o que muda para pequenas empresas?"><label for="cat">Categoria</label><select id="cat"><option>Reforma Tributária</option><option>Contabilidade</option><option>Gestão Empresarial</option><option>Boletins</option><option>Notícias</option></select><label for="author">Autor</label><select id="author"><option>Geone Barbosa</option><option>Nise Consultoria</option></select><label for="desc">Resumo</label><textarea id="desc" rows="2">Entenda os principais pontos que sua empresa deve acompanhar.</textarea><label for="body">Conteúdo</label><textarea id="body" rows="8">A Reforma Tributária exige atenção às particularidades de cada empresa.

Organize documentos e procure orientação especializada antes de tomar decisões.</textarea><button type="submit">Visualizar artigo</button><button type="button" id="draft">Salvar rascunho neste navegador</button></form><p class="muted" id="message" aria-live="polite"></p><div id="preview"><span id="pcat"></span><h2 id="ptitle"></h2><p id="pdesc"></p><small id="pauthor"></small><div id="pbody" style="white-space:pre-wrap;line-height:1.7;margin-top:20px"></div></div></section><p><a href="blog/index.html">← Ver o blog público de demonstração</a></p></main><script>const $=id=>document.getElementById(id);try{const d=JSON.parse(localStorage.getItem('nise_demo_draft')||'null');if(d){for(const k of ['title','cat','author','desc','body'])if(typeof d[k]==='string')$(k).value=d[k]}}catch(e){}$('editor').addEventListener('submit',e=>{e.preventDefault();$('ptitle').textContent=$('title').value;$('pcat').textContent=$('cat').value;$('pdesc').textContent=$('desc').value;$('pauthor').textContent='Por '+$('author').value;$('pbody').textContent=$('body').value;$('preview').style.display='block';$('message').textContent='Prévia gerada. Nenhum conteúdo foi publicado.'});$('draft').addEventListener('click',()=>{try{localStorage.setItem('nise_demo_draft',JSON.stringify(Object.fromEntries(['title','cat','author','desc','body'].map(k=>[k,$(k).value]))));$('message').textContent='Rascunho salvo neste navegador (somente para teste).'}catch(e){$('message').textContent='Não foi possível salvar neste navegador.'}});</script></body></html>
